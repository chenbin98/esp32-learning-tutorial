<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 温湿度监测</title><style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#182b44;background:#edf2f7}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1050px;margin:auto}.panel{background:white;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 8px 28px #18304a12}h1{margin:0}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.value{font-size:42px;font-weight:700;color:#1769e0}.status{padding:12px;border-radius:12px;background:#f4f7fb}.on{color:#b42318}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,select{border:0;border-radius:9px;padding:10px 14px;font:inherit;background:#e5edf8;cursor:pointer}button.primary{background:#1769e0;color:white}button.red{background:#b42318;color:white}canvas{width:100%;height:320px}#message{min-height:24px}.offline{color:#b42318}@media(max-width:600px){body{padding:12px}.grid{grid-template-columns:1fr}.value{font-size:36px}canvas{height:260px}}
</style></head><body><main><header><h1>温湿度监测与 LED 控制</h1><p class="muted">ESP32 · DHT11 · OLED · MQTT · Django + SQLite</p></header>
<section class="panel"><div class="grid"><div><div class="muted">温度</div><div class="value"><span id="temperature">--</span> °C</div></div><div><div class="muted">相对湿度</div><div class="value"><span id="humidity">--</span> %RH</div></div></div>
<p class="status" id="deviceState">等待设备数据</p><p class="muted" id="updated">--</p></section>
<section class="panel"><h2>警示灯控制</h2><p>自动条件：温度 &gt; 25°C 且湿度 &gt; 60% RH；设备本地判断。手动模式暂停自动判断。</p>
<div class="row"><button class="primary" data-mode="auto">自动模式</button><button data-mode="manual" data-led="on">手动点亮</button><button class="red" data-mode="manual" data-led="off">手动关闭</button></div><p id="message" class="muted">控制后等待设备状态回报。</p></section>
<section class="panel"><div class="row"><h2 style="margin-right:auto">历史曲线</h2><label>时间范围 <select id="hours"><option value="6">近 6 小时</option><option value="24" selected>近 24 小时</option><option value="72">近 3 天</option><option value="168">近 7 天</option></select></label><button id="refreshHistory">刷新曲线</button></div>
<canvas id="chart" aria-label="温度和湿度历史曲线"></canvas><p id="historyInfo" class="muted"></p></section></main>
<script>
const $=id=>document.getElementById(id),canvas=$('chart'),ctx=canvas.getContext('2d');
function draw(points){const ratio=devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w*ratio;canvas.height=h*ratio;ctx.scale(ratio,ratio);ctx.clearRect(0,0,w,h);if(!points.length){ctx.fillStyle='#64748b';ctx.fillText('所选时间范围内暂无数据',20,30);return}
const pad={l:48,r:48,t:20,b:35},cw=w-pad.l-pad.r,ch=h-pad.t-pad.b;let tmin=Math.min(...points.map(p=>p.temperature)),tmax=Math.max(...points.map(p=>p.temperature)),hmin=Math.min(...points.map(p=>p.humidity)),hmax=Math.max(...points.map(p=>p.humidity));tmin=Math.floor(tmin-1);tmax=Math.ceil(tmax+1);hmin=Math.max(0,Math.floor(hmin-3));hmax=Math.min(100,Math.ceil(hmax+3));if(tmax===tmin)tmax=tmin+1;if(hmax===hmin)hmax=hmin+1;
ctx.font='12px system-ui';ctx.strokeStyle='#e2e8f0';ctx.fillStyle='#64748b';ctx.lineWidth=1;for(let i=0;i<=4;i++){let y=pad.t+ch*i/4;ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(w-pad.r,y);ctx.stroke();ctx.fillText((tmax-(tmax-tmin)*i/4).toFixed(0)+'°',5,y+4);ctx.fillText((hmax-(hmax-hmin)*i/4).toFixed(0)+'%',w-pad.r+7,y+4)}
const x=i=>pad.l+(points.length<2?cw/2:cw*i/(points.length-1)),yT=v=>pad.t+ch*(tmax-v)/(tmax-tmin),yH=v=>pad.t+ch*(hmax-v)/(hmax-hmin);function line(key,color,y){ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=2;points.forEach((p,i)=>i?ctx.lineTo(x(i),y(p[key])):ctx.moveTo(x(i),y(p[key])));ctx.stroke()}line('temperature','#1769e0',yT);line('humidity','#10a37f',yH);ctx.fillStyle='#1769e0';ctx.fillText('温度',pad.l,14);ctx.fillStyle='#10a37f';ctx.fillText('湿度',pad.l+48,14);ctx.fillStyle='#64748b';ctx.fillText(points.length+' 条采样记录',w-110,14);const first=new Date(points[0].time),last=new Date(points[points.length-1].time);ctx.fillText(first.toLocaleString(),pad.l,h-8);const end=last.toLocaleString();ctx.fillText(end,w-pad.r-ctx.measureText(end).width,h-8)}
async function refreshLatest(){try{const d=await(await fetch('/api/latest/',{cache:'no-store'})).json();if(d.reading){$('temperature').textContent=d.reading.temperature??'--';$('humidity').textContent=d.reading.humidity??'--';$('updated').textContent=(d.reading.sensor_ok?'服务器接收时间：':'采样异常 · 上次接收：')+new Date(d.reading.received_at).toLocaleString()+(d.reading.sensor_ok?' · 自动阈值 '+(d.reading.alarm_condition?'已满足':'未满足'):' · '+(d.reading.error||'传感器异常'))}const s=$('deviceState');s.textContent=(d.online?'设备在线':'设备离线')+' · '+(d.mode==='manual'?'手动模式':'自动模式')+' · 警示灯 '+(d.led_on?'点亮':'关闭');s.className='status '+(!d.online?'offline':(d.led_on?'on':''));if(d.pending_command)$('message').textContent='等待 ESP32 状态回报…';else if(d.command_result==='acknowledged by device')$('message').textContent='ESP32 已确认执行，当前 LED 状态：'+(d.led_on?'点亮':'关闭');else if(d.command_result==='acknowledgement timeout')$('message').textContent='等待设备确认超时；请检查设备和 MQTT 连接';}catch(e){$('deviceState').textContent='无法连接 Django 后台'}}
async function refreshHistory(){const hours=$('hours').value;try{const d=await(await fetch('/api/history/?hours='+hours,{cache:'no-store'})).json();draw(d.points);$('historyInfo').textContent='近 '+hours+' 小时 · 每个点对应一条有效采样记录';}catch(e){$('historyInfo').textContent='历史数据读取失败'}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=async()=>{const body={mode:b.dataset.mode};if(b.dataset.led)body.led=b.dataset.led;try{const r=await fetch('/api/control/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');$('message').textContent='命令已发送，等待 ESP32 状态确认（'+d.command_id+'）';}catch(e){$('message').textContent='控制失败：'+e.message}});$('refreshHistory').onclick=refreshHistory;$('hours').onchange=refreshHistory;refreshLatest();refreshHistory();setInterval(refreshLatest,1000);setInterval(refreshHistory,10000);
</script></body></html>
